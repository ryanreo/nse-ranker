# My NSE watchlist: the 72 counters from the 27 Oct 2026 heatmap.
# Built from docs/RESEARCH.md (R2). Edit this file to add or remove stocks.
#
# status:   "rank"  = scored and ranked
#           "watch" = shown, but not ranked (penny stock, no recent trades, or new type)
#           "out"   = left out (suspended, ETF, preference share, duplicate)
# currency: "KES" for most; "USD" for the dollar-priced REITs.
# aliases:  names the papers use; ALL-CAPS ones must match exactly, the rest ignore case.
# reports_in: set when results are in another currency (EPS and dividends are then ignored).

# What moves each sector. Every stock gets its sector's drivers.
[sectors]
"Banking" = ["interest rates and bond yields", "bad-loan levels", "credit growth", "capital and dividends"]
"Telecommunication" = ["M-Pesa growth", "data revenue", "Ethiopia business", "regulation", "the shilling"]
"Insurance" = ["claims", "investment income from bond yields", "premium growth"]
"Agricultural" = ["auction prices", "weather and rainfall", "the shilling (exports in USD)", "input costs"]
"Energy and Petroleum" = ["EPRA power tariffs", "fuel margins and volumes", "rainfall (hydro)", "government ownership"]
"Manufacturing and Allied" = ["excise duty", "input costs (fuel, grain)", "consumer demand", "the shilling"]
"Automobiles and Accessories" = ["consumer and business credit", "import costs and the shilling"]
"Construction and Allied" = ["infrastructure spending", "housing", "cement demand"]
"Commercial and Services" = ["consumer spending", "tourism", "advertising market"]
"Investment" = ["value of holdings", "property market", "discount to net asset value"]
"Investment Services" = ["market trading turnover", "new listings"]
"Real Estate Investment Trusts" = ["rental income", "occupancy", "distributions"]
"Exchange Traded Funds" = ["the asset the fund tracks"]
"None" = []

