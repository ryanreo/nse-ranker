<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lesson video</title>
<style>
:root{--bg:#0b0c10;--stage:#14161d;--card:#1d2029;--line:#2c303b;--text:#f2f2f0;--muted:#a3a6ae;
--purple:#AFA9EC;--coral:#F0997B;--amber:#FAC775;--green:#97C459;--teal:#5DCAA5;--blue:#85B7EB}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
display:flex;justify-content:center;padding:16px}
.wrap{width:100%;max-width:980px}
.stage{position:relative;aspect-ratio:16/9;background:var(--stage);border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.scene{position:absolute;inset:0;padding:5% 6% 13%;display:flex;flex-direction:column;justify-content:center;gap:2.2vmin}
.label{position:absolute;top:3.5%;left:4%;font-size:clamp(11px,1.5vw,14px);color:var(--muted);letter-spacing:.04em;z-index:2}
.caption{position:absolute;left:6%;right:6%;bottom:4%;text-align:center;font-size:clamp(12px,1.9vw,19px);line-height:1.4;
color:var(--text);background:rgba(0,0,0,.55);padding:.5em .9em;border-radius:8px;z-index:2;min-height:1.4em}
.caption:empty{display:none}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
background:rgba(10,11,15,.82);z-index:5;cursor:pointer;text-align:center;padding:20px}
.overlay .play{width:84px;height:84px;border-radius:50%;background:var(--purple);display:flex;align-items:center;justify-content:center}
.overlay .play:after{content:"";border-left:28px solid #26215C;border-top:17px solid transparent;border-bottom:17px solid transparent;margin-left:7px}
.overlay h1{margin:0;font-size:clamp(20px,3.6vw,36px);font-weight:600}
.overlay p{margin:0;color:var(--muted);font-size:clamp(12px,1.7vw,16px)}
.hidden{display:none}
.bar{display:flex;gap:4px;margin:12px 0 10px}
.seg{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden;cursor:pointer;border:0;padding:0}
.seg i{display:block;height:100%;width:0;background:var(--purple);transition:width .3s}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.controls button,.controls select{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:8px;
padding:8px 14px;font:inherit;font-size:14px;cursor:pointer}
.controls button:hover{border-color:var(--muted)}
.controls .spacer{flex:1}
.controls .hint{color:var(--muted);font-size:13px}

/* reusable visual pieces for scenes */
.s{opacity:0;transform:translateY(14px);transition:opacity .55s ease,transform .55s ease}
.s.on{opacity:1;transform:none}
.big{font-size:clamp(24px,5.4vw,58px);font-weight:700;line-height:1.1;margin:0}
.mid{font-size:clamp(17px,3vw,32px);font-weight:600;line-height:1.25;margin:0}
.sub{font-size:clamp(13px,2vw,21px);color:var(--muted);margin:0;line-height:1.45}
.row{display:flex;gap:2.4vmin;align-items:center;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2vmin}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:1.6vmin 2.2vmin;font-size:clamp(12px,1.75vw,18px);line-height:1.4}
.card b{display:block;font-size:1.08em;margin-bottom:.25em}
.card.purple{border-color:var(--purple)}.card.purple b{color:var(--purple)}
.card.coral{border-color:var(--coral)}.card.coral b{color:var(--coral)}
.card.amber{border-color:var(--amber)}.card.amber b{color:var(--amber)}
.card.green{border-color:var(--green)}.card.green b{color:var(--green)}
.card.teal{border-color:var(--teal)}.card.teal b{color:var(--teal)}
.tag{display:inline-block;font-size:clamp(11px,1.4vw,14px);padding:.2em .7em;border-radius:99px;background:var(--card);border:1px solid var(--line);color:var(--muted)}
.code{font-family:ui-monospace,Consolas,monospace;background:#0e1015;border:1px solid var(--line);border-radius:10px;
padding:1.6vmin 2.2vmin;font-size:clamp(12px,1.9vw,20px);line-height:1.6;white-space:pre;color:#e6e6e6;margin:0}
.code .k{color:var(--purple)}.code .str{color:var(--green)}.code .cm{color:var(--muted)}
.arrow{font-size:clamp(22px,4vw,44px);color:var(--muted)}
.spin{display:inline-block;animation:spin 2.4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.qrgrid{display:grid;grid-template-columns:repeat(21,1fr);width:clamp(110px,22vw,230px);aspect-ratio:1;background:#fff;padding:6px;border-radius:6px;gap:0}
.qrgrid .c{background:#111;opacity:0;transform:scale(.2);transition:opacity .35s,transform .35s}
.qrgrid .c.w{background:transparent}
.s.on .qrgrid .c,.qrgrid.on .c{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.s,.qrgrid .c{transition:none}.spin{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="stage" id="stage">
    <div class="label" id="label"></div>
    <div class="scene" id="scene"></div>
    <div class="caption" id="caption"></div>
    <div class="overlay" id="overlay">
      <div class="play" aria-hidden="true"></div>
      <h1 id="ov-title"></h1>
      <p id="ov-sub">Click to play · sound on</p>
    </div>
  </div>
  <div class="bar" id="bar"></div>
  <div class="controls">
    <button id="b-prev" aria-label="Previous scene">&#9198; Back</button>
    <button id="b-play">Play</button>
    <button id="b-next" aria-label="Next scene">Next &#9197;</button>
    <button id="b-voice">Voice: on</button>
    <select id="b-rate" aria-label="Speed">
      <option value="0.85">Slower</option><option value="1" selected>Normal speed</option><option value="1.2">Faster</option>
    </select>
    <span class="spacer"></span>
    <span class="hint">Space = play/pause · arrows = skip</span>
  </div>
</div>

<!-- ==== VIDEO START ==== -->
<script>
const VIDEO = {
  title: "Briefing: your watchlist file",
  scenes: [
    {
      label: "What we're building",
      say: [
        "Section two turns our research into a file the program can read.",
        "It holds all seventy two stocks from your heatmap, with each one's sector, type and status.",
        "Every later part of the ranker starts from this list."
      ],
      html: `<p class="big s">Your watchlist file</p>
             <p class="mid s">72 stocks: sector, type, status</p>
             <p class="sub s">Prices, news and scores all start from this list</p>`
    },
    {
      label: "The plan",
      say: [
        "There are three parts.",
        "First, watchlist dot toml, a plain text file that lists every stock.",
        "Second, watchlist dot py, which reads that file into Python.",
        "Third, a command that prints a summary, so we can see it worked."
      ],
      html: `<p class="mid s">Three parts</p>
             <div class="grid">
               <div class="card teal s"><b>1. watchlist.toml</b>One block per stock, easy to read and edit</div>
               <div class="card green s"><b>2. watchlist.py</b>Loads the file into a list of dictionaries</div>
               <div class="card amber s"><b>3. python -m nse_ranker watchlist</b>Prints counts and the table</div>
             </div>`
    },
    {
      label: "Key new idea: a list of dictionaries",
      say: [
        "The key new idea is a list of dictionaries.",
        "Each stock is a dictionary: labels like ticker and status, each with a value.",
        "Put all the stocks in a list, and a for loop can visit them one at a time.",
        "Here we loop over two fruits and print each one's name and price."
      ],
      html: `<p class="mid s">A list of dictionaries</p>
             <p class="sub s">Like a stack of index cards: same labels on every card</p>
             <p class="sub s">One card = one dictionary. The stack = the list.</p>
             <div class="code s" data-type="fruits = [
    {&quot;name&quot;: &quot;mango&quot;, &quot;price&quot;: 50},
    {&quot;name&quot;: &quot;banana&quot;, &quot;price&quot;: 10},
]
for fruit in fruits:
    print(fruit[&quot;name&quot;], fruit[&quot;price&quot;])"></div>`
    },
    {
      label: "Watch out for",
      say: [
        "Watch out: text must match exactly. Rank with a capital R is not the same as rank.",
        "A missing label crashes square brackets. The get method returns None instead.",
        "And two stocks, ALP and TRFC, are priced in US dollars, not shillings. The file marks their currency."
      ],
      html: `<div class="grid">
               <div class="card coral s"><b>"Rank" ≠ "rank"</b>Comparisons are exact, capitals included</div>
               <div class="card amber s"><b>card["x"] vs card.get("x")</b>Brackets crash on a missing label; .get gives None</div>
               <div class="card purple s"><b>USD counters</b>ALP and TRFC have currency = "USD"</div>
             </div>`
    },
    {
      label: "Tips",
      say: [
        "Tip one: open the toml file and read a few stocks. It's just text.",
        "Tip two: print one dictionary to see exactly what labels it has.",
        "Tip three: run the tests. They tell you straight away if your function works."
      ],
      html: `<div class="grid">
               <div class="card green s"><b>Read the data</b>watchlist.toml is plain text</div>
               <div class="card teal s"><b>Print to see</b>print(stocks[0]) shows one card</div>
               <div class="card purple s"><b>Run the tests</b><span style="font-family:ui-monospace,Consolas,monospace">python -m unittest</span></div>
             </div>`
    },
    {
      label: "Your mission",
      say: [
        "Your mission is one small function called rankable.",
        "It gets the list of stocks and returns a new list with only the stocks whose status is rank.",
        "Open watchlist dot py, find the to do, and use a for loop with an if. When it works, the summary shows fifty two rankable stocks."
      ],
      html: `<p class="big s">Your mission</p>
             <p class="mid s">rankable(stocks) → only status "rank"</p>
             <p class="sub s">In nse_ranker/watchlist.py, find # TODO. Goal: 52 stocks.</p>`
    }
  ]
};
</script>
<!-- ==== VIDEO END ==== -->

<script>
(() => {
  const $ = id => document.getElementById(id);
  const S = VIDEO.scenes;
  let si = 0, pi = 0, playing = false, voiceOn = true, rate = 1, token = 0, timer = null, voice = null;
  const synth = "speechSynthesis" in window ? window.speechSynthesis : null;

  document.title = VIDEO.title;
  $("ov-title").textContent = VIDEO.title;

  function pickVoice() {
    if (!synth) return;
    const vs = synth.getVoices().filter(v => /^en/i.test(v.lang));
    voice = vs.find(v => /natural|neural|online/i.test(v.name)) || vs.find(v => /en-(US|GB)/i.test(v.lang)) || vs[0] || null;
  }
  if (synth) { pickVoice(); synth.onvoiceschanged = pickVoice; }

  S.forEach((sc, i) => {
    const b = document.createElement("button");
    b.className = "seg"; b.setAttribute("aria-label", "Scene " + (i + 1) + ": " + sc.label);
    b.innerHTML = "<i></i>"; b.onclick = () => jump(i);
    $("bar").appendChild(b);
  });

  function fillQR(el) {
    let seed = 7;
    const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
    const finder = (r, c) => {
      for (const [r0, c0] of [[0, 0], [0, 14], [14, 0]]) {
        const y = r - r0, x = c - c0;
        if (y >= 0 && y < 7 && x >= 0 && x < 7)
          return y === 0 || y === 6 || x === 0 || x === 6 || (y >= 2 && y <= 4 && x >= 2 && x <= 4) ? 1 : 0;
        if (y >= -1 && y <= 7 && x >= -1 && x <= 7) return 0;
      }
      return null;
    };
    let html = "";
    for (let r = 0; r < 21; r++) for (let c = 0; c < 21; c++) {
      const f = finder(r, c), on = f === null ? rnd() > 0.52 : f === 1;
      html += `<div class="c${on ? "" : " w"}" style="transition-delay:${Math.round(rnd() * 900)}ms"></div>`;
    }
    el.innerHTML = html;
  }

  function steps() { return [...$("scene").querySelectorAll(".s")]; }

  function typeOut(el) {
    const full = el.dataset.full; let n = 0;
    el.textContent = "";
    const t = setInterval(() => { el.textContent = full.slice(0, ++n); if (n >= full.length) clearInterval(t); }, 28);
  }

  function reveal(el, instant) {
    if (!el || el.classList.contains("on")) return;
    el.classList.add("on");
    el.querySelectorAll("[data-type]").forEach(t => instant ? t.textContent = t.dataset.full : typeOut(t));
    if (el.hasAttribute("data-type")) instant ? el.textContent = el.dataset.full : typeOut(el);
  }

  function render() {
    const sc = S[si];
    $("scene").innerHTML = sc.html;
    $("label").textContent = `${sc.label}  ·  ${si + 1} / ${S.length}`;
    $("scene").querySelectorAll("[data-type]").forEach(t => { t.dataset.full = t.textContent; t.textContent = ""; });
    $("scene").querySelectorAll(".qrgrid").forEach(fillQR);
    steps().slice(0, pi).forEach(el => reveal(el, true));
    $("caption").textContent = pi > 0 ? sc.say[Math.min(pi, sc.say.length) - 1] : "";
    progress();
  }

  function progress() {
    [...$("bar").children].forEach((b, i) => {
      const pct = i < si ? 100 : i > si ? 0 : Math.round(100 * pi / S[si].say.length);
      b.firstChild.style.width = pct + "%";
    });
  }

  function stopSpeech() { token++; clearTimeout(timer); if (synth) synth.cancel(); }

  function speak(text, done) {
    const my = token;
    const est = Math.max(1400, text.split(/\s+/).length * 400 / rate);
    const finish = () => { if (my === token) { clearTimeout(timer); done(); } };
    if (!voiceOn || !synth) { timer = setTimeout(finish, est); return; }
    const u = new SpeechSynthesisUtterance(text);
    if (voice) u.voice = voice;
    u.rate = rate; u.onend = finish; u.onerror = finish;
    synth.speak(u);
    timer = setTimeout(finish, est + 5000);
  }

  function run() {
    if (!playing) return;
    const sc = S[si];
    if (pi >= sc.say.length) {
      if (si === S.length - 1) { setPlaying(false); return; }
      timer = setTimeout(() => { si++; pi = 0; render(); run(); }, 800);
      return;
    }
    reveal(steps()[pi]);
    $("caption").textContent = sc.say[pi];
    speak(sc.say[pi], () => { pi++; progress(); timer = setTimeout(run, 350); });
  }

  function setPlaying(p) {
    playing = p;
    $("b-play").textContent = p ? "Pause" : (si === S.length - 1 && pi >= S[si].say.length ? "Replay" : "Play");
    $("overlay").classList.add("hidden");
    if (p) {
      if (si === S.length - 1 && pi >= S[si].say.length) { si = 0; pi = 0; render(); }
      run();
    } else stopSpeech();
  }

  function jump(i) {
    stopSpeech();
    si = Math.max(0, Math.min(S.length - 1, i)); pi = 0; render();
    if (playing) run();
  }

  $("overlay").onclick = () => setPlaying(true);
  $("b-play").onclick = () => setPlaying(!playing);
  $("b-prev").onclick = () => jump(pi > 1 ? si : si - 1);
  $("b-next").onclick = () => jump(si + 1);
  $("b-voice").onclick = () => {
    voiceOn = !voiceOn; $("b-voice").textContent = "Voice: " + (voiceOn ? "on" : "off");
    if (playing) { stopSpeech(); run(); }
  };
  $("b-rate").onchange = e => { rate = +e.target.value; };
  document.addEventListener("keydown", e => {
    if (e.target.tagName === "SELECT") return;
    if (e.code === "Space") { e.preventDefault(); setPlaying(!playing); }
    if (e.code === "ArrowRight") jump(si + 1);
    if (e.code === "ArrowLeft") jump(si - 1);
  });
  if (!synth) $("ov-sub").textContent = "Click to play · captions only (no voice in this browser)";
  render();
})();
</script>
</body>
</html>
